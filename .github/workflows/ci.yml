name: CI

# Only pushes. Adding pull_request on top ran every commit twice: the two events
# produce different concurrency keys (`claude/x` vs `refs/heads/claude/x`), so they
# never cancelled each other. GitHub attaches a push run to any pull request whose
# head it is, so pull requests still get their check from this trigger, and commits
# pushed without an open pull request stay covered.
on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

# Supersede an earlier run when new commits land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Pick an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          cat > /tmp/pick-simulator.py <<'PY'
          import json, subprocess, sys

          raw = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True, text=True, check=True).stdout
          candidates = []
          for runtime, devices in json.loads(raw)["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      candidates.append((runtime, device["name"], device["udid"]))
          if not candidates:
              sys.exit("no available iPhone simulator")
          runtime, name, udid = sorted(candidates)[-1]
          sys.stderr.write("Using %s on %s\n" % (name, runtime))
          print(udid)
          PY
          udid=$(python3 /tmp/pick-simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project SBU2.xcodeproj \
            -scheme SBU2 \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project SBU2.xcodeproj \
            -scheme SBU2 \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
